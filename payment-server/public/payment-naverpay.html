<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>네이버페이 결제 · 동네사주카페</title>
  <script src="https://nsp.pay.naver.com/sdk/js/naverpay.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --ink: #1C2333; --gold: #C9A24B; --gold-light: #E8D4A0; --paper: #F7F3E8; --paper-2: #FDFBF5; --text-sub: #6B6252; --line: #E3D9C0; }
    body {
      font-family: "Pretendard", "Noto Sans KR", "맑은 고딕", sans-serif; background: var(--paper); color: var(--ink);
      max-width: 480px; margin: 60px auto; text-align: center; padding: 0 20px;
    }
    h2 { font-size: 17px; font-weight: 800; margin-bottom: 16px; }
    .order-summary {
      background: var(--paper-2); border: 1px solid var(--line); border-radius: 6px; padding: 18px 20px;
      margin-bottom: 22px; font-size: 13.5px; text-align: left; border-top: 3px solid var(--gold);
    }
    .button {
      width: 100%; padding: 14px; border: none; border-radius: 5px;
      background: #03C75A; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer;
    }
    .button:disabled { opacity: 0.5; }
    .notice { margin-top: 16px; font-size: 11.5px; color: var(--text-sub); line-height: 1.6; }
  </style>
</head>
<body>
  <h2>易 동네사주카페 결제 (네이버페이)</h2>
  <div class="order-summary" id="orderSummary">주문 정보를 불러오는 중...</div>
  <button class="button" id="payBtn" disabled>네이버페이로 결제하기</button>
  <div class="notice">
    ※ 네이버페이는 가맹점 심사가 완료된 후 정상 결제가 가능합니다.<br>
    심사 전에는 결제 예약(reserve) 단계에서 인증 오류가 발생하는 것이 정상입니다.
  </div>

  <script>
    (async function () {
      const params = new URLSearchParams(window.location.search);
      const orderId = params.get("orderId");
      const btn = document.getElementById("payBtn");
      const summaryEl = document.getElementById("orderSummary");

      if (!orderId) {
        summaryEl.textContent = "주문 정보가 없습니다.";
        return;
      }

      const res = await fetch(`/api/orders/${orderId}`);
      const data = await res.json();
      if (!data.success) {
        summaryEl.textContent = "주문 정보를 찾을 수 없습니다.";
        return;
      }
      const order = data.order;
      summaryEl.innerHTML = `<strong>${order.orderName}</strong><br>결제금액: ${order.amount.toLocaleString()}원<br>주문자: ${order.customerName || "-"}`;
      btn.disabled = false;

      btn.addEventListener("click", async () => {
        btn.disabled = true;
        btn.textContent = "결제창 준비 중...";
        try {
          const reserveRes = await fetch("/api/naverpay/reserve", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ orderId }),
          });
          const reserveData = await reserveRes.json();
          if (!reserveData.success) {
            alert("결제 준비 실패: " + reserveData.message + "\n(가맹점 심사 완료 전에는 정상적인 오류입니다)");
            btn.disabled = false;
            btn.textContent = "네이버페이로 결제하기";
            return;
          }

          if (window.Naver && window.Naver.Pay) {
            // clientId / chainId / mode 를 서버(.env)에서 받아온다 (하드코딩 제거)
            const cfgRes = await fetch("/api/naverpay/config");
            const cfg = await cfgRes.json();
            if (!cfg.configured) {
              alert("네이버페이 설정(.env의 NAVERPAY_CLIENT_ID / NAVERPAY_CHAIN_ID)이 아직 없습니다.\n가맹점 심사 완료 후 키를 등록하면 바로 결제됩니다.");
              btn.disabled = false;
              btn.textContent = "네이버페이로 결제하기";
              return;
            }
            const oPay = Naver.Pay.create({
              mode: cfg.mode,
              clientId: cfg.clientId,
              chainId: cfg.chainId,
            });
            oPay.open({ reserveId: reserveData.reserveId });
          } else {
            alert("네이버페이 SDK를 불러오지 못했습니다. reserveId: " + reserveData.reserveId);
          }
        } catch (err) {
          alert("오류가 발생했습니다: " + err.message);
        } finally {
          btn.disabled = false;
          btn.textContent = "네이버페이로 결제하기";
        }
      });
    })();
  </script>
</body>
</html>
