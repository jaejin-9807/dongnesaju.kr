<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>관리자 페이지 · 동네사주카페</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #1C2333; --gold: #C9A24B; --gold-light: #E8D4A0;
    --paper: #F7F3E8; --paper-2: #FDFBF5; --text-sub: #6B6252; --line: #E3D9C0;
  }
  body {
    font-family: "Pretendard", "Noto Sans KR", "맑은 고딕", sans-serif;
    background: var(--paper); color: var(--ink); min-height: 100vh;
  }
  header {
    background: var(--ink); color: var(--gold-light); padding: 14px 20px;
    border-bottom: 3px solid var(--gold); display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 20;
  }
  header .logo { font-weight: 800; font-size: 16px; }
  header .nav-right a { color: var(--gold-light); text-decoration: none; font-size: 12px; margin-left: 12px; }
  main { max-width: 980px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
  .sub { font-size: 12px; color: var(--text-sub); margin-bottom: 18px; }

  .sample-box {
    background: var(--paper-2); border: 1px solid var(--line); border-radius: 6px; padding: 16px 18px;
    margin-bottom: 22px; border-top: 3px solid var(--gold); box-shadow: 0 4px 14px rgba(28,35,51,0.06);
  }
  .sample-box .title { font-size: 13.5px; font-weight: 800; margin-bottom: 6px; }
  .sample-box .desc { font-size: 11.5px; color: var(--text-sub); margin-bottom: 12px; line-height: 1.6; }
  .sample-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .sample-btn {
    padding: 9px 16px; border: none; border-radius: 5px; background: var(--ink);
    color: var(--gold-light); font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .sample-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .sample-btn.secondary { background: var(--paper); color: var(--ink); border: 1px solid var(--line); }

  .view-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .view-tab { padding: 9px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper-2); font-size: 13px; font-weight: 800; cursor: pointer; color: var(--text-sub); }
  .view-tab.active { background: var(--ink); color: var(--gold-light); border-color: var(--ink); }
  .member-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
  .member-card { background: var(--paper-2); border: 1px solid var(--line); border-radius: 8px; padding: 14px; box-shadow: 0 3px 10px rgba(28,35,51,.05); }
  .mc-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 8px; }
  .mc-name { font-size: 15px; font-weight: 800; }
  .mc-badge { font-size: 10.5px; font-weight: 800; background: #F0E2CC; color: #7A5C3E; border-radius: 12px; padding: 3px 9px; white-space: nowrap; }
  .mc-info { font-size: 12.5px; line-height: 1.9; color: var(--ink); word-break: break-all; }

  .filter-tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .filter-tab {
    padding: 7px 13px; border-radius: 20px; border: 1px solid var(--line); background: var(--paper-2);
    font-size: 11.5px; font-weight: 700; cursor: pointer; color: var(--text-sub); white-space: nowrap;
  }
  .filter-tab.active { background: var(--ink); color: var(--gold-light); border-color: var(--ink); }

  .search-box { margin-bottom: 14px; }
  .search-box input {
    width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 9px; font-size: 13.5px;
  }

  .status-badge { display: inline-block; font-size: 10.5px; font-weight: 800; padding: 3px 9px; border-radius: 3px; white-space: nowrap; }
  .status-pending { background: #F0E2CC; color: #7A5C3E; }
  .status-waiting { background: #FFF3CD; color: #8A6D3B; }
  .status-done { background: #D8ECD8; color: #2E5A2E; }
  .status-failed { background: #F5D6D6; color: #A33; }

  /* ---- 회원별 그룹(아코디언) ---- */
  .user-group { background: var(--paper-2); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 10px; overflow: hidden; box-shadow: 0 3px 10px rgba(28,35,51,0.05); }
  .user-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 16px; cursor: pointer; }
  .user-head:hover { background: #FBF4E2; }
  .user-head .u-name { font-size: 14px; font-weight: 800; }
  .user-head .u-email { font-size: 11.5px; color: var(--text-sub); font-weight: 600; }
  .user-head .u-right { display: flex; align-items: center; gap: 10px; font-size: 11.5px; color: var(--text-sub); white-space: nowrap; }
  .user-head .u-count { background: var(--ink); color: var(--gold-light); border-radius: 12px; padding: 3px 9px; font-weight: 800; font-size: 11px; }
  .user-head .caret { transition: transform 0.15s; font-size: 12px; }
  .user-group.open .caret { transform: rotate(180deg); }
  .user-orders { display: none; padding: 4px 12px 12px; }
  .user-group.open .user-orders { display: block; }

  .ord { border-top: 1px dashed var(--line); padding: 12px 4px; }
  .ord:first-child { border-top: none; }
  .ord-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .ord-name { font-size: 13px; font-weight: 800; }
  .ord-name .amt { color: var(--text-sub); font-weight: 700; margin-left: 6px; }
  .ord-meta { font-size: 11px; color: var(--text-sub); margin-top: 4px; line-height: 1.6; }
  .ord-flags { font-size: 11.5px; margin-top: 7px; display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .ord-flags .fl b { color: var(--ink); }
  .flag-dl { color: #2E5A2E; font-weight: 800; }
  .flag-wait { color: #8A6D3B; font-weight: 700; }

  .action-btns { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 9px; }
  .action-btn { padding: 7px 11px; border: none; border-radius: 4px; font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .btn-generate { background: var(--ink); color: var(--gold-light); }
  .btn-confirm { background: #2E6B4F; color: #fff; }
  .btn-download { background: var(--gold); color: var(--ink); }
  .btn-reenable { background: #B07A2E; color: #fff; }
  .btn-email { background: #4C7C4C; color: #fff; }
  .btn-sms { background: #3E6FB0; color: #fff; }
  .btn-delete { background: transparent; color: #A33; border: 1px solid #E4B9B9; }
  .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .empty { text-align: center; padding: 50px 20px; color: var(--text-sub); font-size: 13px; }
</style>
</head>
<body>

<header>
  <div class="logo">🔐 동네사주카페 · 관리자</div>
  <div class="nav-right">
    <a href="/" target="_blank">사이트 보기</a>
    <a href="#" id="logoutLink">로그아웃</a>
  </div>
</header>

<main>
  <h1 id="pageTitle">주문 관리</h1>
  <div class="view-tabs" id="viewTabs">
    <button class="view-tab active" data-view="orders">📋 주문 관리</button>
    <button class="view-tab" data-view="members">👥 회원 관리</button>
  </div>

  <div id="ordersView">
  <div class="sub">회원(사용자)을 눌러 주문 이력을 펼치세요. 결과지 생성 상태·사용자 다운로드 여부를 한눈에 볼 수 있어요.</div>

  <div class="sample-box">
    <div class="title">🧪 샘플 PDF 미리보기</div>
    <div class="desc">실제 주문/결제 없이, 결과지 양식이 어떻게 나오는지 바로 확인할 수 있어요. 테스트 인물 데이터로 즉시 생성됩니다.</div>
    <div class="sample-btns">
      <button class="sample-btn" id="sampleSingleBtn">프리미엄 사주풀이 샘플 생성</button>
      <button class="sample-btn secondary" id="sampleCoupleBtn">궁합사주 샘플 생성</button>
    </div>
  </div>

  <div class="filter-tabs" id="filterTabs">
    <button class="filter-tab active" data-filter="all">전체</button>
    <button class="filter-tab" data-filter="PENDING_PAYMENT">결제대기</button>
    <button class="filter-tab" data-filter="PAID_WAITING_DELIVERY">확인/생성대기</button>
    <button class="filter-tab" data-filter="RESULT_READY">결과지 완료</button>
  </div>

  <div class="search-box">
    <input id="searchInput" type="text" placeholder="🔍 주문번호 · 휴대폰번호 · 이름 · 이메일로 검색" />
  </div>

  <div id="groupList"></div>
  </div>

  <div id="membersView" style="display:none;">
    <div class="sub">지금까지 가입한 회원 명단입니다. (최근 가입 순)</div>
    <div class="search-box"><input id="memberSearch" type="text" placeholder="🔍 이름 · 이메일 · 전화번호 검색" /></div>
    <div id="memberSummary" class="sub" style="font-weight:700;color:var(--ink);"></div>
    <div id="memberList"></div>
  </div>
</main>

<script>
  let allOrders = [];
  let currentFilter = "all";
  let currentSearch = "";
  const expandedUsers = new Set();   // 펼쳐진 회원(이메일/ID) 유지

  function statusInfo(o) {
    if (o.status === "PENDING_PAYMENT") return { label: "결제대기", cls: "status-pending" };
    if (o.status === "CANCELLED") return { label: "고객취소", cls: "status-failed" };
    if (o.pdfPath || o.resultStatus === "READY") return { label: "결과지 완료", cls: "status-done" };
    if (o.resultStatus === "GENERATING") return { label: "생성 중", cls: "status-waiting" };
    if (o.resultStatus === "FAILED") return { label: "생성오류", cls: "status-failed" };
    if (o.autoGenerateAt) return { label: "생성 대기", cls: "status-waiting" };
    if (o.status === "PAID_WAITING_DELIVERY") return { label: "확인대기", cls: "status-waiting" };
    if (o.status === "DELIVERED") return { label: "전달완료", cls: "status-done" };
    if (o.status === "FAILED") return { label: "결제실패", cls: "status-failed" };
    return { label: o.status || "-", cls: "status-pending" };
  }

  // 상태 필터용: 결과지 완료 여부
  function isResultReady(o) { return !!o.pdfPath || o.resultStatus === "READY"; }

  function resultText(o) {
    if (isResultReady(o)) return "✅ 생성완료";
    if (o.resultStatus === "GENERATING") return "⏳ 생성 중";
    if (o.resultStatus === "FAILED") return "⚠️ 생성오류";
    if (o.autoGenerateAt) {
      const left = new Date(o.autoGenerateAt).getTime() - Date.now();
      if (left > 0) return `⏱️ 자동생성 ${Math.ceil(left / 60000)}분 후`;
      return "⏳ 생성 대기";
    }
    return "미생성";
  }

  function downloadText(o) {
    if (o.downloadedAt) {
      const t = new Date(o.downloadedAt).toLocaleString("ko-KR");
      return o.redownloadAllowed
        ? `<span class="flag-wait">재발급 허용됨(다운로드 대기)</span>`
        : `<span class="flag-dl">👤 사용자 다운로드함 · ${t}</span>`;
    }
    if (isResultReady(o)) return o.redownloadAllowed ? `재발급 허용됨` : `아직 안 받음`;
    return "-";
  }

  function personLine(label, person) {
    if (!person) return "";
    const b = person.sajuInfo || person;
    return `${label}: <b>${person.name || "-"}</b> / ${person.gender || "-"} / ${b.year || "-"}.${b.month || "-"}.${b.day || "-"}${b.hour ? " " + b.hour + "시" : ""} (${b.calendarType || "-"})`;
  }

  function actionButtonsHtml(o) {
    const canGenerate = o.status !== "CANCELLED" && !!o.sajuResult;
    const hasPdf = isResultReady(o);
    const isPaidPending = o.status === "PENDING_PAYMENT" && Number(o.amount) > 0;
    const canReenable = hasPdf && o.downloadedAt && !o.redownloadAllowed;
    let btns = "";
    if (isPaidPending) {
      btns += `<button class="action-btn btn-confirm" onclick="confirmPayment('${o.orderId}')">입금확인(결제완료)</button>`;
    }
    btns += `<button class="action-btn btn-generate" ${!canGenerate ? "disabled" : ""} onclick="generatePdf('${o.orderId}', this)">운세풀이 즉시생성</button>`;
    btns += `<button class="action-btn btn-download" ${!hasPdf ? "disabled" : ""} onclick="downloadPdf('${o.orderId}')">PDF 다운로드</button>`;
    if (canReenable) btns += `<button class="action-btn btn-reenable" onclick="reenableDownload('${o.orderId}')">재다운로드 허용</button>`;
    btns += `<button class="action-btn btn-email" ${!hasPdf ? "disabled" : ""} onclick="sendEmail('${o.orderId}', this)">메일</button>`;
    btns += `<button class="action-btn btn-sms" ${!hasPdf ? "disabled" : ""} onclick="sendSms('${o.orderId}', this)">문자</button>`;
    btns += `<button class="action-btn btn-delete" onclick="deleteOrder('${o.orderId}')">삭제</button>`;
    return btns;
  }

  function orderHtml(o) {
    const st = statusInfo(o);
    return `
      <div class="ord">
        <div class="ord-top">
          <div class="ord-name">${o.orderName} <span class="amt">${(o.amount || 0).toLocaleString()}원</span></div>
          <span class="status-badge ${st.cls}">${st.label}</span>
        </div>
        <div class="ord-meta">
          주문번호: ${o.orderId} · ${new Date(o.createdAt).toLocaleString("ko-KR")}<br>
          ${personLine("의뢰인", o.person1)}${o.person2 ? "<br>" + personLine("상대방", o.person2) : ""}
          ${o.customerPhone ? "<br>연락처: " + o.customerPhone : ""}
        </div>
        <div class="ord-flags">
          <span class="fl">결과지: <b>${resultText(o)}</b></span>
          <span class="fl">다운로드: ${downloadText(o)}</span>
        </div>
        <div class="action-btns">${actionButtonsHtml(o)}</div>
      </div>`;
  }

  function matchesSearch(o, q, qDigits) {
    if (!q) return true;
    const byId = String(o.orderId || "").toLowerCase().includes(q);
    const byName = String(o.customerName || "").toLowerCase().includes(q);
    const byEmail = String(o.customerEmail || "").toLowerCase().includes(q);
    const byPhone = qDigits && String(o.customerPhone || "").replace(/\D/g, "").includes(qDigits);
    return byId || byName || byEmail || byPhone;
  }

  function render() {
    const q = currentSearch;
    const qDigits = q.replace(/\D/g, "");
    let filtered = allOrders.filter((o) => {
      let passStatus = true;
      if (currentFilter === "RESULT_READY") passStatus = isResultReady(o);
      else if (currentFilter !== "all") passStatus = o.status === currentFilter;
      return passStatus && matchesSearch(o, q, qDigits);
    });

    const listEl = document.getElementById("groupList");
    if (!filtered.length) {
      listEl.innerHTML = `<div class="empty">해당 조건의 주문이 없습니다.</div>`;
      return;
    }

    // 회원별 그룹핑
    const map = new Map();
    for (const o of filtered) {
      const key = o.userId || o.customerEmail || o.orderId;
      if (!map.has(key)) map.set(key, { key, name: o.customerName, email: o.customerEmail, phone: o.customerPhone, orders: [] });
      map.get(key).orders.push(o);
    }
    const groups = [...map.values()];
    for (const g of groups) g.orders.sort((a, b) => (a.createdAt < b.createdAt ? 1 : -1));
    groups.sort((a, b) => (a.orders[0].createdAt < b.orders[0].createdAt ? 1 : -1));

    // 검색 중이면 자동으로 펼침
    const autoOpen = !!q;

    listEl.innerHTML = groups.map((g) => {
      const open = autoOpen || expandedUsers.has(g.key);
      const latest = new Date(g.orders[0].createdAt).toLocaleDateString("ko-KR");
      const pendingCount = g.orders.filter((o) => !isResultReady(o) && o.status !== "CANCELLED").length;
      return `
        <div class="user-group ${open ? "open" : ""}">
          <div class="user-head" onclick="toggleUser('${encodeURIComponent(g.key)}')">
            <div>
              <div class="u-name">${g.name || "이름없음"} ${pendingCount ? `<span style="color:#B07A2E;font-size:11px;">· 처리대기 ${pendingCount}</span>` : ""}</div>
              <div class="u-email">${g.email || ""}${g.phone ? " · " + g.phone : ""}</div>
            </div>
            <div class="u-right">
              <span class="u-count">주문 ${g.orders.length}건</span>
              <span>${latest}</span>
              <span class="caret">▾</span>
            </div>
          </div>
          <div class="user-orders">${g.orders.map(orderHtml).join("")}</div>
        </div>`;
    }).join("");
  }

  function toggleUser(encKey) {
    const key = decodeURIComponent(encKey);
    if (expandedUsers.has(key)) expandedUsers.delete(key);
    else expandedUsers.add(key);
    render();
  }

  async function loadOrders() {
    try {
      const res = await fetch("/api/admin/orders");
      const data = await res.json();
      if (!data.success) {
        if (res.status === 401) { window.location.href = "/admin-login.html"; return; }
        document.getElementById("groupList").innerHTML = `<div class="empty">주문 목록을 불러오지 못했습니다.</div>`;
        return;
      }
      allOrders = data.orders;
      render();
    } catch (e) {
      document.getElementById("groupList").innerHTML = `<div class="empty">불러오기 오류: ${e.message}</div>`;
    }
  }

  async function generatePdf(orderId, btn) {
    btn.disabled = true; btn.textContent = "생성 중...";
    try {
      const res = await fetch(`/api/admin/orders/${orderId}/generate-pdf`, { method: "POST" });
      const data = await res.json();
      if (!data.success) { alert(data.message || "PDF 생성 실패"); btn.disabled = false; btn.textContent = "운세풀이 즉시생성"; return; }
      await loadOrders();
    } catch (e) { alert("오류: " + e.message); btn.disabled = false; btn.textContent = "운세풀이 즉시생성"; }
  }

  function downloadPdf(orderId) { window.open(`/api/admin/orders/${orderId}/pdf`, "_blank"); }

  async function confirmPayment(orderId) {
    if (!confirm("입금을 확인하셨나요?\n결제완료로 처리하고, 1시간 뒤 결과지가 자동 생성됩니다.")) return;
    try {
      const res = await fetch(`/api/admin/orders/${orderId}/confirm-payment`, { method: "POST" });
      const data = await res.json();
      if (!data.success) { alert(data.message || "처리 실패"); return; }
      await loadOrders();
    } catch (e) { alert("오류: " + e.message); }
  }

  async function reenableDownload(orderId) {
    if (!confirm("이 결과지를 사용자가 다시 1회 받을 수 있게 허용할까요?")) return;
    try {
      const res = await fetch(`/api/admin/orders/${orderId}/reenable-download`, { method: "POST" });
      const data = await res.json();
      if (!data.success) { alert(data.message || "실패"); return; }
      await loadOrders();
    } catch (e) { alert("오류: " + e.message); }
  }

  async function deleteOrder(orderId) {
    if (!confirm("이 주문 이력을 삭제할까요?\n되돌릴 수 없습니다.")) return;
    try {
      const res = await fetch(`/api/admin/orders/${orderId}`, { method: "DELETE" });
      const data = await res.json();
      if (!data.success) { alert(data.message || "삭제 실패"); return; }
      await loadOrders();
    } catch (e) { alert("오류: " + e.message); }
  }

  async function sendEmail(orderId, btn) {
    const t = btn.textContent; btn.disabled = true; btn.textContent = "발송 중...";
    try {
      const res = await fetch(`/api/admin/orders/${orderId}/send-email`, { method: "POST" });
      const data = await res.json();
      if (!data.success) { alert(data.message || "메일 발송 실패"); }
      else { alert("고객 메일로 결과지를 발송했습니다."); await loadOrders(); return; }
    } catch (e) { alert("오류: " + e.message); }
    finally { btn.disabled = false; btn.textContent = t; }
  }

  async function sendSms(orderId, btn) {
    const t = btn.textContent; btn.disabled = true; btn.textContent = "발송 중...";
    try {
      const res = await fetch(`/api/admin/orders/${orderId}/send-sms`, { method: "POST" });
      const data = await res.json();
      alert(data.message || (data.success ? "문자를 발송했습니다." : "문자 발송 실패"));
    } catch (e) { alert("오류: " + e.message); }
    finally { btn.disabled = false; btn.textContent = t; }
  }

  async function generateSample(type, btn) {
    const t = btn.textContent; btn.disabled = true; btn.textContent = "생성 중... (1~2분)";
    try {
      const res = await fetch("/api/admin/sample-pdf", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ type }),
      });
      if (!res.ok) { const d = await res.json().catch(() => ({})); alert(d.message || "샘플 생성 실패"); return; }
      const blob = await res.blob();
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = `샘플_사주풀이_결과지_${type}.pdf`;
      document.body.appendChild(a); a.click(); a.remove();
      window.open(url, "_blank");
    } catch (e) { alert("오류: " + e.message); }
    finally { btn.disabled = false; btn.textContent = t; }
  }

  document.getElementById("sampleSingleBtn").addEventListener("click", (e) => generateSample("single", e.target));
  document.getElementById("sampleCoupleBtn").addEventListener("click", (e) => generateSample("couple", e.target));

  document.getElementById("searchInput").addEventListener("input", (e) => { currentSearch = e.target.value.trim().toLowerCase(); render(); });
  document.getElementById("filterTabs").addEventListener("click", (e) => {
    if (!e.target.classList.contains("filter-tab")) return;
    document.querySelectorAll(".filter-tab").forEach((t) => t.classList.remove("active"));
    e.target.classList.add("active");
    currentFilter = e.target.dataset.filter;
    render();
  });
  document.getElementById("logoutLink").addEventListener("click", async (e) => {
    e.preventDefault();
    await fetch("/api/admin/auth/logout", { method: "POST" });
    window.location.href = "/admin-login.html";
  });

  // ===== 회원 관리 탭 =====
  let allMembers = [];
  function providerLabel(p) { return { email: "이메일", kakao: "카카오", naver: "네이버", google: "구글" }[p] || p || "-"; }
  async function loadMembers() {
    const el = document.getElementById("memberList");
    try {
      const res = await fetch("/api/admin/users");
      const data = await res.json();
      if (!data.success) {
        if (res.status === 401) { window.location.href = "/admin-login.html"; return; }
        el.innerHTML = `<div class="empty">회원 목록을 불러오지 못했습니다.</div>`; return;
      }
      allMembers = data.users; renderMembers();
    } catch (e) { el.innerHTML = `<div class="empty">불러오기 오류: ${e.message}</div>`; }
  }
  function renderMembers() {
    const q = (document.getElementById("memberSearch").value || "").trim().toLowerCase();
    const qd = q.replace(/\D/g, "");
    let list = allMembers.filter((u) => {
      if (!q) return true;
      return String(u.name || "").toLowerCase().includes(q)
        || String(u.email || "").toLowerCase().includes(q)
        || (qd && String(u.phone || "").replace(/\D/g, "").includes(qd));
    });
    document.getElementById("memberSummary").textContent =
      `총 ${allMembers.length}명 가입` + (q ? ` · 검색결과 ${list.length}명` : "");
    const el = document.getElementById("memberList");
    if (!list.length) { el.innerHTML = `<div class="empty">해당하는 회원이 없습니다.</div>`; return; }
    el.innerHTML = `<div class="member-cards">` + list.map((u) => `
      <div class="member-card">
        <div class="mc-top"><span class="mc-name">${u.name || "이름없음"}</span><span class="mc-badge">${providerLabel(u.provider)}</span></div>
        <div class="mc-info">
          <div>📧 ${u.email || "-"}</div>
          <div>📱 ${u.phone || "-"}</div>
          <div>🧾 주문 ${u.orderCount || 0}건</div>
          <div>🗓️ ${u.createdAt ? new Date(u.createdAt).toLocaleString("ko-KR") : "-"} 가입</div>
        </div>
      </div>`).join("") + `</div>`;
  }
  document.getElementById("viewTabs").addEventListener("click", (e) => {
    const b = e.target.closest(".view-tab"); if (!b) return;
    document.querySelectorAll(".view-tab").forEach((t) => t.classList.remove("active"));
    b.classList.add("active");
    const v = b.dataset.view;
    document.getElementById("ordersView").style.display = v === "orders" ? "" : "none";
    document.getElementById("membersView").style.display = v === "members" ? "" : "none";
    document.getElementById("pageTitle").textContent = v === "members" ? "회원 관리" : "주문 관리";
    if (v === "members") loadMembers();
  });
  document.getElementById("memberSearch").addEventListener("input", renderMembers);

  loadOrders();
  setInterval(loadOrders, 20000);
</script>
</body>
</html>
