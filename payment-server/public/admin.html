<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>관리자 페이지 · 동네사주카페</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #1C2333; --gold: #C9A24B; --gold-light: #E8D4A0;
    --paper: #F7F3E8; --paper-2: #FDFBF5; --text-sub: #6B6252; --line: #E3D9C0;
  }
  body {
    font-family: "Pretendard", "Noto Sans KR", "맑은 고딕", sans-serif;
    background: var(--paper); color: var(--ink); min-height: 100vh;
  }
  header {
    background: var(--ink); color: var(--gold-light); padding: 14px 20px;
    border-bottom: 3px solid var(--gold); display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 20;
  }
  header .logo { font-weight: 800; font-size: 16px; }
  header .nav-right a { color: var(--gold-light); text-decoration: none; font-size: 12px; margin-left: 12px; }
  main { max-width: 980px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
  .sub { font-size: 12px; color: var(--text-sub); margin-bottom: 18px; }

  .sample-box {
    background: var(--paper-2); border: 1px solid var(--line); border-radius: 6px; padding: 16px 18px;
    margin-bottom: 22px; border-top: 3px solid var(--gold); box-shadow: 0 4px 14px rgba(28,35,51,0.06);
  }
  .sample-box .title { font-size: 13.5px; font-weight: 800; margin-bottom: 6px; }
  .sample-box .desc { font-size: 11.5px; color: var(--text-sub); margin-bottom: 12px; line-height: 1.6; }
  .sample-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .sample-btn {
    padding: 9px 16px; border: none; border-radius: 5px; background: var(--ink);
    color: var(--gold-light); font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .sample-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .sample-btn.secondary { background: var(--paper); color: var(--ink); border: 1px solid var(--line); }

  .filter-tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .filter-tab {
    padding: 7px 13px; border-radius: 20px; border: 1px solid var(--line); background: var(--paper-2);
    font-size: 11.5px; font-weight: 700; cursor: pointer; color: var(--text-sub); white-space: nowrap;
  }
  .filter-tab.active { background: var(--ink); color: var(--gold-light); border-color: var(--ink); }

  /* ---------- 데스크톱: 테이블 뷰 ---------- */
  table { width: 100%; border-collapse: collapse; background: var(--paper-2); border-radius: 6px; overflow: hidden; box-shadow: 0 4px 14px rgba(28,35,51,0.06); }
  thead th {
    background: var(--ink); color: var(--gold-light); font-size: 11px; text-align: left; padding: 10px 10px; font-weight: 700;
  }
  tbody td { padding: 10px; font-size: 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #FBF4E2; }

  .status-badge { display: inline-block; font-size: 10.5px; font-weight: 800; padding: 3px 9px; border-radius: 3px; white-space: nowrap; }
  .status-pending { background: #F0E2CC; color: #7A5C3E; }
  .status-waiting { background: #FFF3CD; color: #8A6D3B; }
  .status-done { background: #D8ECD8; color: #2E5A2E; }
  .status-failed { background: #F5D6D6; color: #A33; }

  .action-btns { display: flex; gap: 5px; flex-wrap: wrap; }
  .action-btn {
    padding: 6px 10px; border: none; border-radius: 4px; font-size: 11px; font-weight: 700; cursor: pointer;
    white-space: nowrap;
  }
  .btn-generate { background: var(--ink); color: var(--gold-light); }
  .btn-download { background: var(--gold); color: var(--ink); }
  .btn-email { background: #4C7C4C; color: #fff; }
  .btn-sms { background: #3E6FB0; color: #fff; }
  .action-btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .detail-row { display: none; }
  .detail-row.active { display: table-row; }
  .detail-box { background: var(--paper); padding: 14px 16px; font-size: 12px; line-height: 1.8; border-radius: 4px; }

  .empty { text-align: center; padding: 60px 20px; color: var(--text-sub); font-size: 13px; }

  /* ---------- 모바일: 카드 뷰 ---------- */
  .card-list { display: none; flex-direction: column; gap: 10px; }
  .order-card {
    background: var(--paper-2); border: 1px solid var(--line); border-radius: 8px; padding: 14px;
    box-shadow: 0 3px 10px rgba(28,35,51,0.06);
  }
  .order-card .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
  .order-card .card-product { font-size: 13.5px; font-weight: 800; }
  .order-card .card-date { font-size: 10.5px; color: var(--text-sub); margin-top: 2px; }
  .order-card .card-info { font-size: 12px; line-height: 1.7; color: var(--ink); margin-bottom: 10px; }
  .order-card .card-info b { color: var(--ink); }
  .order-card .card-amount { font-weight: 800; }
  .order-card .card-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .order-card .card-actions .action-btn { flex: 1 1 auto; padding: 10px 8px; font-size: 11.5px; text-align: center; }
  .order-card .card-toggle { font-size: 11px; color: var(--text-sub); margin-top: 8px; text-decoration: underline; cursor: pointer; }
  .order-card .card-detail { display: none; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); font-size: 11.5px; line-height: 1.8; color: var(--text-sub); }
  .order-card .card-detail.active { display: block; }

  @media (max-width: 720px) {
    header { padding: 12px 14px; }
    header .logo { font-size: 14.5px; }
    main { padding: 16px 12px 50px; }
    h1 { font-size: 16.5px; }
    .sample-box { padding: 14px; }
    .sample-btn { flex: 1 1 auto; text-align: center; }
    table { display: none; }
    .card-list { display: flex; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">🔐 동네사주카페 · 관리자</div>
  <div class="nav-right">
    <a href="/" target="_blank">사이트 보기</a>
    <a href="#" id="logoutLink">로그아웃</a>
  </div>
</header>

<main>
  <h1>주문 관리</h1>
  <div class="sub">결제 상태와 무관하게 운세풀이를 진행하고, PDF/메일/문자로 결과지를 전달하세요.</div>

  <div class="sample-box">
    <div class="title">🧪 샘플 PDF 미리보기</div>
    <div class="desc">실제 주문/결제 없이, 배포 전 결과지 양식이 어떻게 나오는지 바로 확인할 수 있어요. 테스트 인물 데이터로 즉시 생성됩니다.</div>
    <div class="sample-btns">
      <button class="sample-btn" id="sampleSingleBtn">프리미엄 사주풀이 샘플 생성</button>
      <button class="sample-btn secondary" id="sampleCoupleBtn">궁합사주 샘플 생성</button>
    </div>
  </div>

  <div class="filter-tabs" id="filterTabs">
    <button class="filter-tab active" data-filter="all">전체</button>
    <button class="filter-tab" data-filter="PENDING_PAYMENT">결제대기</button>
    <button class="filter-tab" data-filter="PAID_WAITING_DELIVERY">결제완료·확인대기</button>
    <button class="filter-tab" data-filter="DELIVERED">전달완료</button>
  </div>

  <div style="margin-bottom:14px;">
    <input id="searchInput" type="text" placeholder="🔍 주문번호 · 휴대폰번호 · 이름으로 검색"
      style="width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:9px;font-size:13.5px;box-sizing:border-box;" />
  </div>

  <div id="tableWrap"></div>
  <div class="card-list" id="cardList"></div>
</main>

<script>
  let allOrders = [];
  let currentFilter = "all";
  let currentSearch = "";

  function statusInfo(order) {
    if (order.status === "PENDING_PAYMENT") return { label: "결제대기", cls: "status-pending" };
    if (order.status === "PAID_WAITING_DELIVERY") return { label: "결제완료·확인대기", cls: "status-waiting" };
    if (order.status === "DELIVERED") return { label: "전달완료", cls: "status-done" };
    if (order.status === "FAILED") return { label: "결제실패", cls: "status-failed" };
    if (order.status === "CANCELLED") return { label: "고객취소", cls: "status-failed" };
    return { label: order.status || "-", cls: "status-pending" };
  }

  function personLine(label, person) {
    if (!person) return "";
    const b = person.sajuInfo || person;
    return `${label}: <b>${person.name || "-"}</b>${person.nameHanja ? "(" + person.nameHanja + ")" : ""} / ${person.gender || "-"} / ${b.year || "-"}년 ${b.month || "-"}월 ${b.day || "-"}일${b.hour ? " " + b.hour + "시" + (b.minute ? b.minute + "분" : "") : ""} (${b.calendarType || "-"}) ${person.zodiac ? "/ " + person.zodiac : ""}`;
  }

  function actionButtonsHtml(o) {
    const canGenerate = o.status !== "FAILED" && o.status !== "CANCELLED";
    const hasPdf = !!o.pdfPath;
    return `
      <button class="action-btn btn-generate" ${!canGenerate ? "disabled" : ""} onclick="generatePdf('${o.orderId}', this)">운세풀이 시작하기</button>
      <button class="action-btn btn-download" ${!hasPdf ? "disabled" : ""} onclick="downloadPdf('${o.orderId}')">PDF 다운로드</button>
      <button class="action-btn btn-email" ${!hasPdf ? "disabled" : ""} onclick="sendEmail('${o.orderId}', this)">메일로 보내기</button>
      <button class="action-btn btn-sms" ${!hasPdf ? "disabled" : ""} onclick="sendSms('${o.orderId}', this)">문자로 보내기</button>
    `;
  }

  async function loadOrders() {
    const res = await fetch("/api/admin/orders");
    const data = await res.json();
    if (!data.success) {
      if (res.status === 401) { window.location.href = "/admin-login.html"; return; }
      document.getElementById("tableWrap").innerHTML = `<div class="empty">주문 목록을 불러오지 못했습니다.</div>`;
      return;
    }
    allOrders = data.orders;
    render();
  }

  function render() {
    let filtered = currentFilter === "all" ? allOrders : allOrders.filter((o) => o.status === currentFilter);
    if (currentSearch) {
      const q = currentSearch;
      const qDigits = q.replace(/\D/g, "");
      filtered = filtered.filter((o) => {
        const byId = String(o.orderId || "").toLowerCase().includes(q);
        const byName = String(o.customerName || "").toLowerCase().includes(q);
        const byPhone = qDigits && String(o.customerPhone || "").replace(/\D/g, "").includes(qDigits);
        return byId || byName || byPhone;
      });
    }
    const wrap = document.getElementById("tableWrap");
    const cardList = document.getElementById("cardList");

    if (!filtered.length) {
      wrap.innerHTML = `<div class="empty">해당 상태의 주문이 없습니다.</div>`;
      cardList.innerHTML = `<div class="empty">해당 상태의 주문이 없습니다.</div>`;
      return;
    }

    // ---- 데스크톱 테이블 ----
    wrap.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>주문일시</th><th>상품</th><th>의뢰인</th><th>금액</th><th>상태</th><th>결과지</th><th></th>
          </tr>
        </thead>
        <tbody>
          ${filtered.map((o, idx) => {
            const st = statusInfo(o);
            return `
              <tr onclick="toggleDetail(${idx})" style="cursor:pointer;">
                <td>${new Date(o.createdAt).toLocaleString("ko-KR")}</td>
                <td>${o.orderName}</td>
                <td>${o.customerName} (${o.customerEmail})</td>
                <td>${o.amount.toLocaleString()}원</td>
                <td><span class="status-badge ${st.cls}">${st.label}</span></td>
                <td>${o.pdfPath ? "생성완료" : "-"}</td>
                <td onclick="event.stopPropagation();"><div class="action-btns">${actionButtonsHtml(o)}</div></td>
              </tr>
              <tr class="detail-row" id="detail-${idx}">
                <td colspan="7">
                  <div class="detail-box">
                    ${personLine("의뢰인", o.person1)}<br>
                    ${o.person2 ? personLine("상대방", o.person2) + "<br>" : ""}
                    주문번호: ${o.orderId}<br>
                    연락처: ${o.customerPhone || "-"}<br>
                    결제수단: ${o.pg || "-"}
                    ${o.deliverableAt ? `<br>확인 목표시각: ${new Date(o.deliverableAt).toLocaleString("ko-KR")}` : ""}
                  </div>
                </td>
              </tr>
            `;
          }).join("")}
        </tbody>
      </table>
    `;

    // ---- 모바일 카드 ----
    cardList.innerHTML = filtered.map((o, idx) => {
      const st = statusInfo(o);
      return `
        <div class="order-card">
          <div class="card-top">
            <div>
              <div class="card-product">${o.orderName}</div>
              <div class="card-date">${new Date(o.createdAt).toLocaleString("ko-KR")}</div>
            </div>
            <span class="status-badge ${st.cls}">${st.label}</span>
          </div>
          <div class="card-info">
            의뢰인: <b>${o.customerName}</b><br>
            금액: <span class="card-amount">${o.amount.toLocaleString()}원</span><br>
            결과지: ${o.pdfPath ? "생성완료" : "미생성"}
          </div>
          <div class="card-actions">${actionButtonsHtml(o)}</div>
          <div class="card-toggle" onclick="toggleCardDetail(${idx})">상세 정보 보기</div>
          <div class="card-detail" id="card-detail-${idx}">
            ${personLine("의뢰인", o.person1)}<br>
            ${o.person2 ? personLine("상대방", o.person2) + "<br>" : ""}
            주문번호: ${o.orderId}<br>
            연락처: ${o.customerPhone || "-"}<br>
            메일: ${o.customerEmail || "-"}<br>
            결제수단: ${o.pg || "-"}
            ${o.deliverableAt ? `<br>확인 목표시각: ${new Date(o.deliverableAt).toLocaleString("ko-KR")}` : ""}
          </div>
        </div>
      `;
    }).join("");
  }

  function toggleDetail(idx) {
    const row = document.getElementById(`detail-${idx}`);
    if (row) row.classList.toggle("active");
  }

  function toggleCardDetail(idx) {
    const box = document.getElementById(`card-detail-${idx}`);
    if (box) box.classList.toggle("active");
  }

  async function generatePdf(orderId, btn) {
    btn.disabled = true;
    btn.textContent = "생성 중...";
    try {
      const res = await fetch(`/api/admin/orders/${orderId}/generate-pdf`, { method: "POST" });
      const data = await res.json();
      if (!data.success) {
        alert(data.message || "PDF 생성에 실패했습니다.");
        btn.disabled = false;
        btn.textContent = "운세풀이 시작하기";
        return;
      }
      await loadOrders();
    } catch (e) {
      alert("오류가 발생했습니다: " + e.message);
      btn.disabled = false;
      btn.textContent = "운세풀이 시작하기";
    }
  }

  function downloadPdf(orderId) {
    window.open(`/api/admin/orders/${orderId}/pdf`, "_blank");
  }

  async function sendEmail(orderId, btn) {
    const originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = "발송 중...";
    try {
      const res = await fetch(`/api/admin/orders/${orderId}/send-email`, { method: "POST" });
      const data = await res.json();
      if (!data.success) {
        alert(data.message || "메일 발송에 실패했습니다.");
      } else {
        alert("고객 메일로 결과지를 발송했습니다.");
        await loadOrders();
        return;
      }
    } catch (e) {
      alert("오류가 발생했습니다: " + e.message);
    } finally {
      btn.disabled = false;
      btn.textContent = originalText;
    }
  }

  async function sendSms(orderId, btn) {
    const originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = "발송 중...";
    try {
      const res = await fetch(`/api/admin/orders/${orderId}/send-sms`, { method: "POST" });
      const data = await res.json();
      alert(data.message || (data.success ? "문자를 발송했습니다." : "문자 발송에 실패했습니다."));
    } catch (e) {
      alert("오류가 발생했습니다: " + e.message);
    } finally {
      btn.disabled = false;
      btn.textContent = originalText;
    }
  }

  // ---- 샘플 PDF 미리보기 ----
  async function generateSample(type, btn) {
    const originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = "생성 중... (10~20초 소요)";
    try {
      const res = await fetch("/api/admin/sample-pdf", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ type }),
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        alert(data.message || "샘플 PDF 생성에 실패했습니다.");
        return;
      }
      const blob = await res.blob();
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `샘플_사주풀이_결과지_${type}.pdf`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      window.URL.revokeObjectURL(url);
      window.open(url, "_blank");
    } catch (e) {
      alert("오류가 발생했습니다: " + e.message);
    } finally {
      btn.disabled = false;
      btn.textContent = originalText;
    }
  }

  document.getElementById("sampleSingleBtn").addEventListener("click", (e) => generateSample("single", e.target));
  document.getElementById("sampleCoupleBtn").addEventListener("click", (e) => generateSample("couple", e.target));

  {
    const si = document.getElementById("searchInput");
    if (si) si.addEventListener("input", () => { currentSearch = si.value.trim().toLowerCase(); render(); });
  }
  document.getElementById("filterTabs").addEventListener("click", (e) => {
    if (!e.target.classList.contains("filter-tab")) return;
    document.querySelectorAll(".filter-tab").forEach((t) => t.classList.remove("active"));
    e.target.classList.add("active");
    currentFilter = e.target.dataset.filter;
    render();
  });

  document.getElementById("logoutLink").addEventListener("click", async (e) => {
    e.preventDefault();
    await fetch("/api/admin/auth/logout", { method: "POST" });
    window.location.href = "/admin-login.html";
  });

  loadOrders();
  setInterval(loadOrders, 30000);
</script>
</body>
</html>
