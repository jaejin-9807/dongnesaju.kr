<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>관리자 로그인 · 동네사주카페</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --ink: #1C2333; --gold: #C9A24B; --gold-light: #E8D4A0; --paper: #F7F3E8; --paper-2: #FDFBF5; --text-sub: #6B6252; --line: #E3D9C0; }
  body {
    font-family: "Pretendard", "Noto Sans KR", "맑은 고딕", sans-serif;
    background: var(--ink); color: var(--ink); min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  .box {
    background: var(--paper-2); border-radius: 8px; padding: 34px 28px; max-width: 360px; width: 100%;
    box-shadow: 0 16px 48px rgba(0,0,0,0.35); border-top: 3px solid var(--gold); margin: 20px;
  }
  .box h1 { font-size: 18px; font-weight: 800; margin-bottom: 4px; text-align: center; }
  .box .sub { font-size: 11.5px; color: var(--text-sub); text-align: center; margin-bottom: 22px; }
  .form-row { margin-bottom: 12px; }
  .form-row input {
    width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 5px;
    font-size: 13.5px; background: var(--paper); font-family: inherit;
  }
  .form-row input:focus { outline: none; border-color: var(--gold); }
  .submit-btn {
    width: 100%; padding: 13px; border: none; border-radius: 5px; background: var(--ink);
    color: var(--gold-light); font-size: 14.5px; font-weight: 700; cursor: pointer; margin-top: 6px;
  }
  .msg { font-size: 12.5px; color: #B03A3A; margin-top: 10px; text-align: center; min-height: 16px; }
</style>
</head>
<body>
  <div class="box">
    <h1>🔐 관리자 로그인</h1>
    <div class="sub">동네사주카페 운영자 전용 페이지입니다</div>
    <div class="form-row"><input type="text" id="adminId" placeholder="관리자 아이디" /></div>
    <div class="form-row"><input type="password" id="password" placeholder="비밀번호" /></div>
    <button class="submit-btn" id="loginBtn">로그인</button>
    <div class="msg" id="msg"></div>
  </div>

  <script>
    document.getElementById("loginBtn").addEventListener("click", async () => {
      const adminId = document.getElementById("adminId").value.trim();
      const password = document.getElementById("password").value;
      const msg = document.getElementById("msg");
      if (!adminId || !password) {
        msg.textContent = "아이디와 비밀번호를 입력해 주세요.";
        return;
      }
      try {
        const res = await fetch("/api/admin/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ adminId, password }),
        });
        const data = await res.json();
        if (!data.success) {
          msg.textContent = data.message || "로그인에 실패했습니다.";
          return;
        }
        window.location.href = "/admin.html";
      } catch (e) {
        msg.textContent = "서버와 통신 중 오류가 발생했습니다: " + e.message;
      }
    });
  </script>
</body>
</html>
