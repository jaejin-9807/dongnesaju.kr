<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>마이페이지 · 동네사주카페</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #1C2333; --gold: #C9A24B; --gold-light: #E8D4A0;
    --paper: #F7F3E8; --paper-2: #FDFBF5; --text-sub: #6B6252; --line: #E3D9C0;
  }
  body {
    font-family: "Pretendard", "Noto Sans KR", "맑은 고딕", sans-serif;
    background: var(--paper); color: var(--ink); min-height: 100vh;
  }
  header {
    background: var(--ink); color: var(--gold-light); padding: 16px 20px;
    border-bottom: 3px solid var(--gold); display: flex; align-items: center; justify-content: space-between;
  }
  header a.logo { color: var(--gold-light); text-decoration: none; font-weight: 800; font-size: 17px; }
  header .nav-right { display: flex; align-items: center; gap: 14px; font-size: 12.5px; }
  header .nav-right a { color: var(--gold-light); text-decoration: none; }
  main { max-width: 720px; margin: 0 auto; padding: 30px 20px 60px; }
  h1 { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
  .sub { font-size: 13px; color: var(--text-sub); margin-bottom: 20px; }

  .order-card {
    background: var(--paper-2); border: 1px solid var(--line); border-radius: 6px;
    padding: 18px 20px; margin-bottom: 14px; box-shadow: 0 4px 14px rgba(28,35,51,0.06);
    border-top: 3px solid var(--gold);
  }
  /* 상단: 상품명(좌) + 상태 배지(우측 끝) */
  .order-card .row1 { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .order-card .product-name { font-size: 15.5px; font-weight: 800; }
  .order-card .amount-row { margin-top: 4px; }
  .order-card .amount { font-size: 15px; font-weight: 800; color: var(--ink); }
  .order-card .meta { font-size: 12px; color: var(--text-sub); margin-top: 6px; margin-bottom: 12px; }

  .status-badge {
    display: inline-block; font-size: 11px; font-weight: 800; padding: 5px 11px; border-radius: 20px;
    white-space: nowrap; flex-shrink: 0;
  }
  .status-pending { background: #F0E2CC; color: #7A5C3E; }
  .status-waiting { background: #FFF3CD; color: #8A6D3B; }
  .status-done { background: #D8ECD8; color: #2E5A2E; }
  .status-failed { background: #F5D6D6; color: #A33; }

  /* 버튼 공통 */
  .btn-row { display: flex; gap: 8px; margin-top: 12px; }
  .btn {
    flex: 1; padding: 12px 10px; border-radius: 5px; font-size: 13.5px; font-weight: 800;
    cursor: pointer; border: none; text-align: center; font-family: inherit;
  }
  .btn-primary { background: var(--ink); color: var(--gold-light); }
  .btn-primary:hover { opacity: 0.92; }
  .btn-outline { background: transparent; color: #A33; border: 1.5px solid #E4B9B9; }
  .btn-outline:hover { background: #F9E9E9; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* 결과지 박스 */
  .result-box { margin-top: 12px; border-radius: 6px; padding: 16px; text-align: center; }
  .result-box.wait { background: #FBF6EA; border: 1px solid var(--line); }
  .result-box.ready { background: #F0F7EE; border: 1.5px solid #B9D9B0; }
  .result-box.done { background: var(--paper); border: 1px solid var(--line); }
  .rb-title { font-size: 14px; font-weight: 800; margin-bottom: 8px; }
  .rb-note { font-size: 11.5px; color: var(--text-sub); margin-top: 10px; line-height: 1.55; }
  .countdown {
    font-size: 30px; font-weight: 800; letter-spacing: 2px; color: var(--ink);
    font-variant-numeric: tabular-nums; margin: 6px 0 2px;
  }
  .result-box .btn { width: 100%; flex: none; }
  .spinner {
    display: inline-block; width: 18px; height: 18px; border: 2.5px solid var(--line);
    border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* ── 결과지 작성 진행 표시 ─────────────────────────── */
  .brush { font-size: 30px; display: inline-block; animation: brushMove 2.4s ease-in-out infinite; }
  @keyframes brushMove { 0%,100%{ transform: translateX(-7px) rotate(-8deg);} 50%{ transform: translateX(7px) rotate(8deg);} }
  .prog-wrap { margin: 14px 0 10px; }
  .prog-bar { position: relative; height: 22px; background: #EFE7D4; border-radius: 11px; overflow: hidden;
    box-shadow: inset 0 1px 3px rgba(28,35,51,.10); }
  .prog-fill { height: 100%; width: 0%; border-radius: 11px; transition: width 1.1s cubic-bezier(.4,0,.2,1);
    background: linear-gradient(90deg, #C9A24B, #E0BE6C, #C9A24B); background-size: 200% 100%;
    animation: progShine 2.2s linear infinite; }
  @keyframes progShine { to { background-position: -200% 0; } }
  .prog-pct { font-size: 20px; font-weight: 800; color: var(--ink); margin-top: 8px; letter-spacing: 0.5px; }
  .prog-step { font-size: 13.5px; color: var(--text-sub); margin-top: 4px; line-height: 1.6; min-height: 20px; }
  .prog-steps { display: flex; justify-content: space-between; margin-top: 12px; gap: 4px; }
  .prog-steps .s { flex: 1; font-size: 10.5px; color: #B9AE95; text-align: center; line-height: 1.35; }
  .prog-steps .s.on { color: var(--gold); font-weight: 800; }
  .prog-steps .s .dot { display: block; width: 9px; height: 9px; border-radius: 50%; background: #DED3B8; margin: 0 auto 4px; }
  .prog-steps .s.on .dot { background: var(--gold); box-shadow: 0 0 0 3px rgba(201,162,75,.22); }

  .empty { text-align: center; padding: 60px 20px; color: var(--text-sub); font-size: 14px; }
  .empty a { color: var(--ink); font-weight: 700; }

  @media (max-width: 480px) {
    header { padding: 12px 14px; }
    main { padding: 20px 14px 50px; }
    h1 { font-size: 17px; }
    .order-card { padding: 14px 15px; }
    .countdown { font-size: 26px; }
  }
</style>
</head>
<body>

<header>
  <a class="logo" href="/">易 동네사주카페</a>
  <div class="nav-right">
    <a href="/">홈으로</a>
    <a href="#" id="logoutLink">로그아웃</a>
  </div>
</header>

<main>
  <h1>마이페이지</h1>
  <div class="sub" id="userInfo">불러오는 중...</div>
  <div id="orderList"></div>
</main>

<script>
  // 결과지 준비 여부: PDF가 생성됐는가
  function hasResult(o) { return !!o.pdfPath || o.resultStatus === "READY"; }

  function statusInfo(o) {
    if (o.status === "PENDING_PAYMENT" && !o.paymentConfirmed) return { label: "결제·입금 대기", cls: "status-pending" };
    if (o.status === "CANCELLED") return { label: "취소됨", cls: "status-failed" };
    const released = !!o.paymentConfirmed;      // 관리자 입금확인 여부
    if (hasResult(o) && released) {
      return { label: o.viewedAt ? "확인 가능" : "결과지 준비완료", cls: "status-done" };
    }
    if (!released) return { label: "입금 확인 대기", cls: "status-waiting" };
    return { label: "결과지 준비 중", cls: "status-waiting" };
  }

  // 결제대기 주문의 버튼(결제하기 · 주문취소) — 같은 크기로 나란히
  function payBlock(o) {
    return `
      <div class="btn-row">
        <button class="btn btn-primary" onclick="location.href='/payment-toss.html?orderId=${o.orderId}'">결제하기</button>
        <button class="btn btn-outline" onclick="cancelOrder('${o.orderId}')">주문 취소</button>
      </div>`;
  }

  // 결과지 영역(카운트다운 → 생성중 → 다운로드 1회 → 완료)
  function resultBlock(o) {
    const released = !!o.paymentConfirmed;   // 관리자 입금확인 여부
    // 1) 입금확인 + 결과지 준비 완료 → 열람 가능
    if (hasResult(o) && released) {
      return `
        <div class="result-box ready">
          <div class="rb-title">🎉 사주 결과지가 완성되었어요!</div>
          <button class="btn btn-primary" onclick="viewResult('${o.orderId}')">🔮 사주결과 보기</button>
          <div class="rb-note">버튼을 누르면 결과지가 화면에서 바로 열려요. 언제든 다시 볼 수 있어요.<br>
            <a href="/api/orders/${o.orderId}/pdf?dl=1" style="color:var(--ink);font-weight:700;">📄 PDF 파일로 저장하기</a></div>
        </div>`;
    }
    // 2) 아직 입금확인 전 → 결과지가 준비돼 있어도 열람 불가
    if (!released) {
      const amt = Number(o.amount) || 0;
      return `
        <div class="result-box wait">
          <div class="rb-title">⏳ 입금 확인을 기다리고 있어요</div>
          <div class="account-box" style="margin:10px auto 12px;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;text-align:left;">
            <div style="font-weight:800;color:var(--ink);margin-bottom:6px;">💳 입금 계좌</div>
            <div style="font-size:15px;font-weight:800;color:var(--ink);letter-spacing:0.3px;">토스뱅크 1002-6663-7130</div>
            <div style="font-size:13px;color:var(--text-sub);margin-top:2px;">예금주: 살림허브${amt ? ` · 입금액 <b style="color:var(--ink)">${amt.toLocaleString()}원</b>` : ""}</div>
          </div>
          <div class="rb-note">위 계좌로 입금하신 뒤 <b>채팅상담</b>으로 “<b>${(o.customerName || "이름")}</b> ${amt ? amt.toLocaleString() + "원 " : ""}입금”을 남겨주세요.<br>
            사장님이 입금을 확인하면 이 화면에서 바로 결과지를 보실 수 있어요.</div>
        </div>`;
    }
    // 3) 입금은 확인됐지만 아직 결과지 생성 전 — 작성 과정을 진행률로 보여 준다
    const startedAt = o.paymentConfirmedAt || o.paidAt || o.createdAt || new Date().toISOString();
    return `
      <div class="result-box wait">
        <div class="brush">🖌️</div>
        <div class="rb-title">역술가 님이 결과지를 만들고 있습니다</div>
        <div class="prog-wrap" data-started="${startedAt}">
          <div class="prog-bar"><div class="prog-fill"></div></div>
          <div class="prog-pct">0%</div>
          <div class="prog-step">준비하는 중…</div>
          <div class="prog-steps">
            <div class="s"><span class="dot"></span>사주 원국<br>세우기</div>
            <div class="s"><span class="dot"></span>오행·십성<br>분석</div>
            <div class="s"><span class="dot"></span>대운·세운<br>풀이</div>
            <div class="s"><span class="dot"></span>글로<br>옮기기</div>
            <div class="s"><span class="dot"></span>책자<br>엮기</div>
          </div>
        </div>
        <div class="rb-note">정성껏 풀이하는 중이라 최대 10분 정도 걸립니다.<br>
          창을 닫으셔도 계속 진행되며, 완성되면 이 화면에서 바로 보실 수 있어요.</div>
      </div>`;
  }

  // ── 결과지 작성 진행률 애니메이션 ──────────────────────────
  // 실제 생성 시간(약 10분)에 맞춰 0→97%까지 천천히 차오르고,
  // 완성되면 렌더가 갱신되며 '보기' 버튼으로 바뀐다.
  const PROG_TOTAL_MS = 10 * 60 * 1000;
  const PROG_STEPS = [
    { to: 18, label: "태어난 연·월·일·시로 사주 원국을 세우고 있어요" },
    { to: 40, label: "다섯 기운(오행)의 균형과 십성을 살펴보는 중이에요" },
    { to: 62, label: "10년 큰 흐름(대운)과 올해 운세를 짚어 보는 중이에요" },
    { to: 84, label: "풀이한 내용을 글로 정성껏 옮겨 적고 있어요" },
    { to: 97, label: "표와 그림을 넣어 책자로 엮는 중이에요" },
  ];
  function tickProgress() {
    document.querySelectorAll(".prog-wrap").forEach((w) => {
      const started = new Date(w.dataset.started || Date.now()).getTime();
      const elapsed = Math.max(0, Date.now() - started);
      const ratio = Math.min(1, elapsed / PROG_TOTAL_MS);
      // 초반엔 빠르게, 후반엔 천천히(기다림의 체감을 줄임)
      const pct = Math.min(97, Math.round(97 * Math.pow(ratio, 0.72)));
      const fill = w.querySelector(".prog-fill");
      const pctEl = w.querySelector(".prog-pct");
      const stepEl = w.querySelector(".prog-step");
      if (fill) fill.style.width = pct + "%";
      if (pctEl) pctEl.textContent = pct + "%";
      let idx = PROG_STEPS.findIndex((s) => pct <= s.to);
      if (idx < 0) idx = PROG_STEPS.length - 1;
      if (stepEl) stepEl.textContent = PROG_STEPS[idx].label;
      w.querySelectorAll(".prog-steps .s").forEach((el, i) => el.classList.toggle("on", i <= idx));
    });
  }
  setInterval(tickProgress, 1000);

  function cardHtml(o) {
    const st = statusInfo(o);
    let body = "";
    if (o.status === "PENDING_PAYMENT") body = payBlock(o);
    body += resultBlock(o);
    return `
      <div class="order-card">
        <div class="row1">
          <div class="product-name">${o.orderName}</div>
          <span class="status-badge ${st.cls}">${st.label}</span>
        </div>
        <div class="amount-row"><span class="amount">${(o.amount || 0).toLocaleString()}원</span></div>
        <div class="meta">주문번호: ${o.orderId} · ${new Date(o.createdAt).toLocaleString("ko-KR")}</div>
        ${body}
      </div>`;
  }

  async function loadAndRender() {
    const listEl = document.getElementById("orderList");
    try {
      const ordersRes = await fetch("/api/orders/mine");
      const ordersData = await ordersRes.json();
      if (!ordersData.success || !ordersData.orders.length) {
        listEl.innerHTML = `<div class="empty">아직 등록한 주문이 없습니다.<br><a href="/">상품 보러 가기</a></div>`;
        return;
      }
      listEl.innerHTML = ordersData.orders.map(cardHtml).join("");
      tickCountdowns();
      tickProgress();   // 진행률 막대를 즉시 현재 값으로 표시
    } catch (e) {
      listEl.innerHTML = `<div class="empty">주문 정보를 불러오지 못했습니다: ${e.message}</div>`;
    }
  }

  function tickCountdowns() {
    document.querySelectorAll(".countdown").forEach((el) => {
      const until = new Date(el.dataset.until).getTime();
      let r = until - Date.now();
      if (r <= 0) { el.textContent = "완성 중..."; return; }
      const h = Math.floor(r / 3600000);
      const m = Math.floor((r % 3600000) / 60000);
      const s = Math.floor((r % 60000) / 1000);
      const p = (n) => String(n).padStart(2, "0");
      el.textContent = `${p(h)}:${p(m)}:${p(s)}`;
    });
  }

  // '사주결과 보기': 전용 뷰어 페이지에서 브라우저 안에 직접 렌더링(PDF 뷰어 앱 불필요, 다운로드 없음)
  function viewResult(orderId) {
    window.location.href = `/result-view.html?orderId=${encodeURIComponent(orderId)}`;
  }

  (async function init() {
    try {
      const meRes = await fetch("/api/auth/me");
      const meData = await meRes.json();
      if (!meData.success) { window.location.href = "/login.html"; return; }
      document.getElementById("userInfo").textContent = `${meData.user.name}님 (${meData.user.email})`;
      await loadAndRender();
      // 카운트다운은 1초마다, 데이터 새로고침은 15초마다
      setInterval(tickCountdowns, 1000);
      setInterval(loadAndRender, 15000);
    } catch (e) {
      document.getElementById("orderList").innerHTML =
        `<div class="empty">주문 정보를 불러오지 못했습니다: ${e.message}</div>`;
    }
  })();

  document.getElementById("logoutLink").addEventListener("click", async (e) => {
    e.preventDefault();
    await fetch("/api/auth/logout", { method: "POST" });
    window.location.href = "/";
  });

  async function cancelOrder(orderId) {
    if (!confirm("이 주문을 취소하시겠어요? 취소 후 홈페이지에서 상품과 생년월일 정보를 다시 정확히 입력해 새로 주문해 주세요.")) return;
    try {
      const res = await fetch(`/api/orders/${orderId}/cancel`, { method: "POST" });
      const data = await res.json();
      if (!data.success) { alert(data.message || "주문 취소에 실패했습니다."); return; }
      alert("주문이 취소되었습니다. 홈페이지에서 새로 주문해 주세요.");
      window.location.href = "/";
    } catch (e) {
      alert("서버와 통신 중 오류가 발생했습니다: " + e.message);
    }
  }
</script>
</body>
</html>
