<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>로그인 · 동네사주카페</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #1C2333; --gold: #C9A24B; --gold-light: #E8D4A0;
    --paper: #F7F3E8; --paper-2: #FDFBF5; --text-sub: #6B6252; --line: #E3D9C0;
  }
  body {
    font-family: "Pretendard", "Noto Sans KR", "맑은 고딕", sans-serif;
    background: var(--paper); color: var(--ink); min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
  }
  header {
    width: 100%; background: var(--ink); color: var(--gold-light);
    padding: 18px 20px; text-align: center; border-bottom: 3px solid var(--gold);
  }
  header a { color: var(--gold-light); text-decoration: none; font-weight: 800; font-size: 17px; }
  .wrap { max-width: 380px; width: 100%; padding: 50px 20px; }
  .box {
    background: var(--paper-2); border-radius: 8px; padding: 32px 26px;
    box-shadow: 0 8px 28px rgba(28,35,51,0.10); border: 1px solid var(--line); border-top: 3px solid var(--gold);
  }
  .box h1 { font-size: 19px; font-weight: 800; margin-bottom: 22px; text-align: center; }
  .social-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 12px; border-radius: 5px; border: 1px solid var(--line);
    background: #fff; font-size: 13.5px; font-weight: 700; cursor: pointer; margin-bottom: 9px; color: var(--ink);
  }
  .social-btn.naver { background: #03C75A; color: #fff; border: none; }
  .social-btn.kakao { background: #FEE500; color: #3C1E1E; border: none; }
  .social-btn.google { background: #fff; }
  .social-ic { flex: 0 0 auto; vertical-align: middle; }
  .divider { display: flex; align-items: center; gap: 10px; margin: 18px 0; color: var(--text-sub); font-size: 11.5px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .form-row { margin-bottom: 12px; }
  .form-row input {
    width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 5px;
    font-size: 13.5px; background: var(--paper); font-family: inherit;
  }
  .form-row input:focus { outline: none; border-color: var(--gold); }
  .submit-btn {
    width: 100%; padding: 13px; border: none; border-radius: 5px; background: var(--ink);
    color: var(--gold-light); font-size: 14.5px; font-weight: 700; cursor: pointer; margin-top: 6px;
  }
  .submit-btn:hover { opacity: 0.9; }
  .msg { font-size: 12.5px; color: #B03A3A; margin-top: 10px; text-align: center; min-height: 16px; }
  .bottom-link { text-align: center; margin-top: 16px; font-size: 12.5px; color: var(--text-sub); }
  .bottom-link a { color: var(--ink); font-weight: 700; text-decoration: none; }
</style>
</head>
<body>

<header><a href="/">易 동네사주카페</a></header>

<div class="wrap">
  <div class="box">
    <h1>로그인</h1>
    <button class="social-btn kakao" id="kakaoBtn"><svg class="social-ic" width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path fill="#3C1E1E" d="M12 3C6.48 3 2 6.52 2 10.86c0 2.79 1.86 5.24 4.66 6.63-.15.53-.96 3.3-.99 3.52 0 0-.02.16.09.22.1.06.23.01.23.01.29-.04 3.36-2.2 3.9-2.58.68.1 1.38.15 2.11.15 5.52 0 10-3.52 10-7.95C22 6.52 17.52 3 12 3z"/></svg><span>카카오로 로그인</span></button>
    <button class="social-btn google" id="googleBtn"><svg class="social-ic" width="16" height="16" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg><span>구글로 로그인</span></button>

    <div class="divider">또는 이메일·휴대폰으로 로그인</div>

    <div class="form-row"><input type="text" id="email" placeholder="이메일 또는 휴대폰 번호" /></div>
    <div class="form-row"><input type="password" id="password" placeholder="비밀번호" /></div>
    <button class="submit-btn" id="loginBtn">로그인</button>
    <div class="msg" id="msg"></div>

    <div class="bottom-link">아직 계정이 없으신가요? <a href="/signup.html">회원가입</a></div>
  </div>
</div>

<script>
  const msg = document.getElementById("msg");
  document.getElementById("kakaoBtn").addEventListener("click", () => { window.location.href = "/api/auth/kakao"; });
  document.getElementById("googleBtn").addEventListener("click", () => { window.location.href = "/api/auth/google"; });

  // 소셜 로그인 실패/준비중 등으로 되돌아온 경우 쿼리스트링(socialError)에 담긴 안내문 표시
  (function showSocialErrorIfAny() {
    const params = new URLSearchParams(window.location.search);
    const err = params.get("socialError");
    if (err) {
      msg.style.color = "#8A6D3B";
      msg.textContent = err;
    }
  })();

  document.getElementById("loginBtn").addEventListener("click", async () => {
    const identifier = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    msg.style.color = "#B03A3A";
    if (!identifier || !password) {
      msg.textContent = "이메일(또는 휴대폰 번호)과 비밀번호를 입력해 주세요.";
      return;
    }
    try {
      const res = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ identifier, password }),
      });
      const data = await res.json();
      if (!data.success) {
        msg.textContent = data.message || "로그인에 실패했습니다.";
        return;
      }
      window.location.href = "/my.html";
    } catch (e) {
      msg.textContent = "서버와 통신 중 오류가 발생했습니다: " + e.message;
    }
  });
</script>
</body>
</html>
